<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE BUTTERFLY ARCHIVE</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-texture: url('https://www.transparenttextures.com/patterns/concrete-wall.png');
            --butterfly-pattern: url('https://cdn.pixabay.com/photo/2017/02/08/17/24/fantasy-2049567_1280.jpg');
            --glass-bg: rgba(255, 255, 255, 0.15);
            --border-color: rgba(255, 255, 255, 0.6);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #b5b5b0; /* 이미지의 차분한 그레이 베이지 */
            background-image: var(--bg-texture); /* 거친 벽면 질감 */
            display: flex; align-items: center; justify-content: center;
            font-family: 'Noto Serif KR', serif;
            overflow: hidden;
        }

        /* 은은하게 깔리는 나비 배경 레이어 */
        .butterfly-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: var(--butterfly-pattern);
            background-size: cover;
            opacity: 0.12; /* 은은한 투명도 */
            mix-blend-mode: overlay;
            pointer-events: none;
            z-index: 1;
        }

        /* 메인 프레임 컨테이너 */
        .archive-frame {
            position: relative;
            z-index: 10;
            width: 90vw;
            max-width: 900px;
            height: 90vh;
            max-height: 1200px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 2px solid var(--border-color);
            border-radius: 50px;
            padding: 30px;
            box-sizing: border-box;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        /* SVG 분할 레이아웃 */
        svg {
            width: 100%; height: 100%;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1));
        }

        /* 기하학적 칸(Cell) 스타일 */
        .cell {
            fill: var(--glass-bg);
            stroke: var(--border-color);
            stroke-width: 3;
            transition: all 0.4s ease;
            cursor: pointer;
        }

        .cell:hover {
            fill: rgba(255, 255, 255, 0.4);
            filter: brightness(1.1);
        }

        /* 텍스트 스타일 */
        .title-text {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            fill: #1a1a1a;
            letter-spacing: -1px;
        }

        .menu-label {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            fill: #222;
            font-weight: 700;
        }

        .sub-label {
            font-family: 'Noto Serif KR', serif;
            font-size: 14px;
            fill: #555;
        }

        .coord-text {
            font-size: 11px;
            fill: rgba(0,0,0,0.4);
            font-family: monospace;
        }

        /* 하단 정보 바 */
        .bottom-info {
            position: absolute;
            bottom: 40px; left: 50px;
            background: rgba(255,255,255,0.4);
            padding: 10px 25px;
            border-radius: 20px;
            font-size: 12px;
            color: #444;
            border: 1px solid var(--border-color);
        }

    </style>
</head>
<body>

    <div class="butterfly-overlay"></div>

    <div class="archive-frame">
        <svg viewBox="0 0 1000 1300">
            <a href="index.html">
                <path class="cell" d="M30,30 L450,30 L400,380 L30,420 Z" />
                <text x="60" y="80" class="coord-text">a index.html</text>
            </a>

            <a href="about.html">
                <path class="cell" d="M480,30 L970,30 L970,220 L450,220 Z" />
                <text x="510" y="70" class="coord-text">a 380, 20</text>
                <text x="550" y="130" class="menu-label">About</text>
                <text x="550" y="165" class="sub-label">Yeonwoo's Story</text>
            </a>

            <a href="project.html">
                <path class="cell" d="M480,250 L970,250 L750,550 L420,400 Z" />
                <text x="510" y="290" class="coord-text">a 580, 570</text>
                <text x="530" y="360" class="menu-label">Project</text>
                <text x="530" y="390" class="sub-label">Anmeil 13, opacity: 6.0</text>
            </a>

            <path class="cell" d="M30,450 L580,420 L580,750 L30,750 Z" />
            <text x="60" y="490" class="coord-text">a 300, 470</text>
            <text x="60" y="580" class="title-text">THE BUTTERFLY</text>
            <text x="60" y="640" class="title-text">ARCHIVE</text>

            <a href="project.html">
                <path class="cell" d="M620,420 L970,420 L970,720 L620,580 Z" />
                <text x="650" y="460" class="coord-text">a 980, 550</text>
                <text x="700" y="530" class="menu-label">Project</text>
                <text x="700" y="560" class="sub-label">Animation Film</text>
            </a>

            <a href="gallery.html">
                <path class="cell" d="M30,780 L400,780 L400,1080 L30,1080 Z" />
                <text x="60" y="820" class="coord-text">a 200, 470</text>
                <text x="80" y="950" class="menu-label">Gallery</text>
            </a>

            <a href="archive.html">
                <path class="cell" d="M430,780 L970,780 L970,1080 L350,1250 Z" />
                <text x="650" y="950" class="menu-label">Archive</text>
            </a>
        </svg>

        <div class="bottom-info">
            YEONWOO. ARCHIVE.HAML<br>
            https://255.255.25.x / 2025
        </div>
    </div>

</body>
</html>
