<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Butterfly Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #dcdcdc; /* 이미지의 차분한 그레이/베이지 톤 */
            --line-color: #ffffff;
            --text-main: #333333;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg-color);
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png'); /* 종이 질감 */
            font-family: 'Noto Serif KR', serif;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* 은은한 나비 배경 레이어 */
        .butterfly-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://cdn.pixabay.com/photo/2017/02/08/17/24/fantasy-2049567_1280.jpg');
            background-size: cover;
            opacity: 0.05;
            z-index: -1;
        }

        /* 메인 프레임 */
        .main-frame {
            position: relative;
            width: 90vh; height: 90vh; /* 정사각형 프레임 유지 */
            background: #e0e0e0;
            box-shadow: inset 10px 10px 20px #bebebe, inset -10px -10px 20px #ffffff;
            border-radius: 40px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* SVG 칸 분할 스타일 */
        svg {
            width: 100%; height: 100%;
            filter: drop-shadow(2px 2px 5px rgba(0,0,0,0.1));
        }

        .cell {
            fill: rgba(255, 255, 255, 0.3);
            stroke: var(--line-color);
            stroke-width: 4;
            transition: all 0.4s ease;
            cursor: pointer;
        }

        .cell:hover {
            fill: rgba(255, 255, 255, 0.7);
        }

        /* 텍스트 요소 */
        .label {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            fill: var(--text-main);
            pointer-events: none; /* 클릭 방지 */
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .time-text {
            font-size: 80px;
            fill: #fff;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        }

        /* 하단 바 디자인 요소 */
        .bottom-deco {
            position: absolute;
            bottom: 40px; left: 40px;
            width: 250px; height: 60px;
            background: rgba(255,255,255,0.5);
            border-radius: 10px;
            display: flex; align-items: center; padding-left: 20px;
            font-size: 12px; color: #666;
            box-shadow: 5px 5px 10px rgba(0,0,0,0.05);
        }

    </style>
</head>
<body>

    <div class="butterfly-bg"></div>

    <div class="main-frame">
        <svg viewBox="0 0 1000 1000">
            <a href="index.html">
                <path class="cell" d="M20,20 L350,20 L300,400 L20,450 Z" />
                <text x="60" y="380" class="label time-text">3:14</text>
            </a>

            <a href="about.html">
                <path class="cell" d="M370,20 L580,20 L550,550 L320,400 Z" />
                <text x="400" y="80" class="label" style="font-size: 24px;">About</text>
                <text x="400" y="110" class="label" style="font-size: 14px; opacity: 0.6;">Yeonwoo's Story</text>
            </a>

            <a href="project.html">
                <path class="cell" d="M600,20 L980,20 L980,500 L570,550 Z" />
                <text x="630" y="80" class="label" style="font-size: 24px;">Project</text>
                <text x="630" y="110" class="label" style="font-size: 12px; opacity: 0.5;">The Butterfly Archive</text>
            </a>

            <a href="gallery.html">
                <path class="cell" d="M20,470 L280,420 L500,700 L500,980 L20,980 Z" />
                <text x="60" y="900" class="label" style="font-size: 24px;">Gallery</text>
            </a>

            <a href="archive.html"> <path class="cell" d="M520,570 L980,520 L980,980 L520,980 Z" />
                <text x="560" y="900" class="label" style="font-size: 24px;">Archive / Contact</text>
            </a>

            <text x="950" y="850" class="label" style="font-size: 12px; writing-mode: vertical-rl; opacity: 0.3;">UPC: 0707883257434</text>
        </svg>

        <div class="bottom-deco">
            WHOEVER™<br>THE BUTTERFLY ARCHIVE ©2025
        </div>
    </div>

</body>
</html>
