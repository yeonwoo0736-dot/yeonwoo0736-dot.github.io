<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE BUTTERFLY ARCHIVE</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 1. 사용자가 주신 거친 벽면 질감 배경 이미지 */
            --bg-image: url('https://i.ibb.co/p6Y0LpY/17408dd68d0caf0c572ba3bcd64da8e3.jpg');
            /* 2. 은은하게 비치는 나비 패턴 */
            --butterfly-pattern: url('https://cdn.pixabay.com/photo/2017/02/08/17/24/fantasy-2049567_1280.jpg');
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #b5b5b0;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Noto Serif KR', serif;
            overflow: hidden;
        }

        /* 배경 레이어: 벽면 질감 사진 */
        .background-base {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            z-index: -2;
        }

        /* 배경 레이어: 은은한 나비 문양 (반투명하게 겹침) */
        .butterfly-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: var(--butterfly-pattern);
            background-size: cover;
            opacity: 0.15; /* 나비가 은은하게 보이도록 조절 */
            mix-blend-mode: overlay;
            pointer-events: none;
            z-index: -1;
        }

        /* 메인 기하학 프레임 */
        .archive-frame {
            position: relative;
            width: 90vw;
            max-width: 900px;
            height: 90vh;
            max-height: 1200px;
            background: rgba(255, 255, 255, 0.1); /* 유리 효과 */
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 40px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
        }

        svg {
            width: 100%; height: 100%;
        }

        /* 각 칸(Cell) 디자인 */
        .cell {
            fill: rgba(255, 255, 255, 0.1);
            stroke: rgba(255, 255, 255, 0.7);
            stroke-width: 3;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .cell:hover {
            fill: rgba(255, 255, 255, 0.3);
        }

        /* 텍스트 스타일 */
        .title-text { font-family: 'Playfair Display', serif; font-size: 45px; fill: #111; }
        .menu-label { font-family: 'Playfair Display', serif; font-size: 30px; fill: #222; font-weight: 700; }
        .sub-label { font-family: 'Noto Serif KR', serif; font-size: 15px; fill: #444; }
        .coord-text { font-size: 10px; fill: rgba(0,0,0,0.5); font-family: monospace; }

        /* 하단 장식 바 */
        .bottom-bar {
            position: absolute;
            bottom: 40px; left: 50px;
            background: rgba(255,255,255,0.3);
            padding: 8px 20px;
            border-radius: 15px;
            font-size: 12px;
            color: #333;
            border: 1px solid rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>

    <div class="background-base"></div>
    <div class="butterfly-layer"></div>

    <div class="archive-frame">
        <svg viewBox="0 0 1000 1300">
            <a href="about.html">
                <path class="cell" d="M480,30 L970,30 L970,250 L450,250 Z" />
                <text x="500" y="60" class="coord-text">a 380, 20</text>
                <text x="550" y="140" class="menu-label">About</text>
                <text x="550" y="180" class="sub-label">Yeonwoo's Story</text>
            </a>

            <a href="project.html">
                <path class="cell" d="M480,280 L970,280 L750,580 L420,430 Z" />
                <text x="500" y="320" class="coord-text">a 580, 570</text>
                <text x="530" y="420" class="menu-label">Project</text>
            </a>

            <path class="cell" d="M30,450 L580,420 L580,750 L30,750 Z" />
            <text x="60" y="490" class="coord-text">a 300, 470</text>
            <text x="60" y="580" class="title-text">THE BUTTERFLY</text>
            <text x="60" y="650" class="title-text">ARCHIVE</text>

            <a href="project.html">
                <path class="cell" d="M620,450 L970,450 L970,750 L620,600 Z" />
                <text x="650" y="480" class="coord-text">a 980, 550</text>
                <text x="700" y="580" class="menu-label">Project</text>
            </a>

            <a href="gallery.html">
                <path class="cell" d="M30,780 L400,780 L400,1100 L30,1100 Z" />
                <text x="60" y="820" class="coord-text">a 200, 470</text>
                <text x="100" y="980" class="menu-label">Gallery</text>
            </a>

            <a href="archive.html">
                <path class="cell" d="M430,780 L970,780 L970,1100 L350,1250 Z" />
                <text x="600" y="980" class="menu-label">Archive</text>
            </a>
        </svg>

        <div class="bottom-bar">
            YEONWOO. ARCHIVE.HAML / 2025
        </div>
    </div>

</body>
</html>
