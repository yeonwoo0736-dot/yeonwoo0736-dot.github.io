<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE BUTTERFLY ARCHIVE</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 연우님이 주신 실제 질감 배경 이미지 */
            --bg-image: url('https://i.ibb.co/p6Y0LpY/17408dd68d0caf0c572ba3bcd64da8e3.jpg');
            /* 은은한 나비 문양 (질감 위에 겹침) */
            --butterfly: url('https://cdn.pixabay.com/photo/2017/02/08/17/24/fantasy-2049567_1280.jpg');
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background-color: #9c9a93;
            overflow: hidden;
            font-family: 'Playfair Display', serif;
        }

        /* 1. 배경 설정: 질감 사진 + 나비 문양 겹침 */
        .full-background {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), var(--bg-image);
            background-size: cover;
            background-position: center;
            z-index: -2;
        }
        .butterfly-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: var(--butterfly);
            background-size: cover;
            opacity: 0.1;
            mix-blend-mode: soft-light;
            z-index: -1;
        }

        /* 2. 이미지의 둥근 프레임 재현 */
        .glass-container {
            position: relative;
            width: 90vw;
            max-width: 800px;
            height: 90vh;
            max-height: 1100px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 60px; /* 이미지의 부드러운 곡선 */
            box-shadow: 0 40px 100px rgba(0,0,0,0.3);
            padding: 30px;
            box-sizing: border-box;
        }

        svg {
            width: 100%; height: 100%;
        }

        /* 3. 이미지와 똑같은 기하학적 칸(Cell) 디자인 */
        .cell {
            fill: rgba(255, 255, 255, 0.2);
            stroke: rgba(255, 255, 255, 0.8);
            stroke-width: 3;
            transition: 0.3s;
            cursor: pointer;
        }
        .cell:hover {
            fill: rgba(255, 255, 255, 0.4);
        }

        /* 4. 텍스트 디테일 (이미지와 똑같은 위치와 크기) */
        .coord { font-size: 11px; fill: rgba(0,0,0,0.5); font-family: monospace; }
        .menu-title { font-size: 28px; fill: #1a1a1a; font-weight: 700; }
        .sub-title { font-size: 14px; fill: #444; font-family: 'Noto Serif KR', serif; }
        .main-title { font-size: 38px; fill: #111; letter-spacing: -1px; line-height: 1.2; }
        .small-tag { font-size: 10px; fill: rgba(0,0,0,0.4); text-transform: lowercase; }

        /* 하단 장식 요소 */
        .footer-decor {
            position: absolute;
            bottom: 40px; left: 50px;
            background: rgba(255,255,255,0.3);
            padding: 10px 20px;
            border-radius: 15px;
            font-size: 12px;
            line-height: 1.4;
            color: #222;
            border: 1px solid rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>

    <div class="full-background"></div>
    <div class="butterfly-layer"></div>

    <div class="glass-container">
        <svg viewBox="0 0 1000 1350">
            <a href="index.html">
                <path class="cell" d="M30,30 L450,30 L410,400 L30,440 Z" />
                <text x="60" y="80" class="coord">a index.html</text>
                <text x="60" y="380" class="small-tag">bpehceni</text>
            </a>

            <a href="about.html">
                <path class="cell" d="M480,30 L970,30 L970,230 L460,230 Z" />
                <text x="500" y="60" class="coord">a 380, 20</text>
                <text x="560" y="130" class="menu-title">About</text>
                <text x="560" y="165" class="sub-title">Yeonwoo's Story</text>
            </a>

            <a href="project.html">
                <path class="cell" d="M490,260 L970,260 L750,580 L440,410 Z" />
                <text x="510" y="295" class="coord">a 580,570</text>
                <text x="530" y="360" class="menu-title">Project</text>
                <text x="530" y="390" class="sub-title">Anmeil 13, opacity : 6.0</text>
                <text x="850" y="420" class="small-tag">erepctml</text>
            </a>

            <path class="cell" d="M30,470 L600,430 L590,780 L30,780 Z" />
            <text x="60" y="500" class="coord">a 300,470</text>
            <text x="65" y="600" class="main-title">THE BUTTERFLY</text>
            <text x="65" y="660" class="main-title">ARCHIVE</text>
            <text x="540" y="750" class="small-tag">heonl</text>

            <a href="project.html">
                <path class="cell" d="M630,450 L970,450 L970,780 L620,620 Z" />
                <text x="650" y="480" class="coord">a 980,550</text>
                <text x="700" y="600" class="menu-title">Project</text>
                <text x="700" y="635" class="sub-title">Animation Film</text>
            </a>

            <a href="gallery.html">
                <path class="cell" d="M30,810 L410,810 L410,1130 L30,1130 Z" />
                <text x="60" y="845" class="coord">a 200,470</text>
                <text x="100" y="1030" class="menu-title">Gallery</text>
            </a>

            <a href="archive.html">
                <path class="cell" d="M440,810 L970,810 L970,1130 L380,1300 Z" />
                <text x="650" y="1030" class="menu-title">Archive</text>
            </a>
        </svg>

        <div class="footer-decor">
            a &nbsp; archive.haml<br>
            httpel:: 255.2583.X6 / hegKu s'eBGUS - 300S
        </div>
    </div>

</body>
</html>
