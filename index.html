<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE BUTTERFLY ARCHIVE</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-image: url('https://i.ibb.co/p6Y0LpY/17408dd68d0caf0c572ba3bcd64da8e3.jpg');
            --butterfly-pattern: url('https://cdn.pixabay.com/photo/2017/02/08/17/24/fantasy-2049567_1280.jpg');
            --accent-color: rgba(255, 255, 255, 0.7);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #b5b5b0;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Noto Serif KR', serif;
            overflow: hidden; /* 배경 고정 */
        }

        /* 배경 레이어 */
        .background-base {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            z-index: -2;
        }

        .butterfly-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: var(--butterfly-pattern);
            background-size: cover;
            opacity: 0.15;
            mix-blend-mode: overlay;
            pointer-events: none;
            z-index: -1;
        }

        /* 메인 프레임 */
        .archive-frame {
            position: relative;
            width: 90vw;
            max-width: 900px;
            height: 90vh;
            max-height: 1200px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 40px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            overflow-y: auto; /* 내용 많아질 경우 대비 */
        }

        /* 스크롤바 숨기기 */
        .archive-frame::-webkit-scrollbar { display: none; }

        svg { width: 100%; height: auto; display: block; }

        /* 셀 디자인 */
        .cell {
            fill: rgba(255, 255, 255, 0.05);
            stroke: var(--accent-color);
            stroke-width: 2;
            transition: all 0.4s ease;
            cursor: pointer;
        }

        .cell:hover { fill: rgba(255, 255, 255, 0.2); stroke: #fff; }

        /* 텍스트 스타일 */
        .title-text { font-family: 'Playfair Display', serif; font-size: 45px; fill: #111; pointer-events: none; }
        .menu-label { font-family: 'Playfair Display', serif; font-size: 30px; fill: #111; font-weight: 700; pointer-events: none; }
        .sub-label { font-family: 'Noto Serif KR', serif; font-size: 15px; fill: #333; pointer-events: none; }
        .coord-text { font-size: 10px; fill: rgba(0,0,0,0.4); font-family: monospace; pointer-events: none; }

        /* 방명록 입력 영역 (Archive 셀 하단에 숨겨진 느낌으로 배치) */
        .guestbook-overlay {
            margin-top: -150px; /* SVG 위치와 겹치게 조정 */
            padding: 40px;
            position: relative;
            z-index: 10;
        }

        .guestbook-input {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .guestbook-input input, .guestbook-input textarea {
            background: rgba(255, 255, 255, 0.8);
            border: none;
            padding: 10px;
            border-radius: 5px;
            font-family: inherit;
        }

        .guestbook-btn {
            background: #111;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Playfair Display', serif;
        }

        .message-list {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 5px;
            border-left: 3px solid #111;
            font-size: 14px;
            color: #111;
        }

        .bottom-bar {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            letter-spacing: 2px;
            color: #222;
        }
    </style>
</head>
<body>

    <div class="background-base"></div>
    <div class="butterfly-layer"></div>

    <div class="archive-frame">
        <svg viewBox="0 0 1000 1300">
            <g onclick="location.href='#about'">
                <path class="cell" d="M480,30 L970,30 L970,250 L450,250 Z" />
                <text x="500" y="60" class="coord-text">a 380, 20</text>
                <text x="550" y="140" class="menu-label">About</text>
                <text x="550" y="180" class="sub-label">Yeonwoo's Story</text>
            </g>

            <g onclick="location.href='#project'">
                <path class="cell" d="M480,280 L970,280 L750,580 L420,430 Z" />
                <text x="500" y="320" class="coord-text">a 580, 570</text>
                <text x="530" y="420" class="menu-label">Project</text>
            </g>

            <g>
                <path class="cell" d="M30,450 L580,420 L580,750 L30,750 Z" />
                <text x="60" y="490" class="coord-text">a 300, 470</text>
                <text x="60" y="580" class="title-text">THE BUTTERFLY</text>
                <text x="60" y="650" class="title-text">ARCHIVE</text>
            </g>

            <g onclick="location.href='#gallery'">
                <path class="cell" d="M30,780 L400,780 L400,1100 L30,1100 Z" />
                <text x="60" y="820" class="coord-text">a 200, 470</text>
                <text x="100" y="980" class="menu-label">Gallery</text>
            </g>

            <g onclick="document.getElementById('guestbook-input').focus();">
                <path class="cell" d="M430,780 L970,780 L970,1100 L350,1250 Z" />
                <text x="600" y="980" class="menu-label">Archive</text>
                <text x="600" y="1020" class="sub-label">Leave a Message</text>
            </g>
        </svg>

        <div class="guestbook-overlay">
            <div class="guestbook-input">
                <input type="text" id="userName" placeholder="Name">
                <textarea id="userMessage" id="guestbook-input" rows="2" placeholder="Write your message..."></textarea>
                <button class="guestbook-btn" onclick="addMsg()">SEND TO ARCHIVE</button>
            </div>
            <div class="message-list" id="msgList">
                <div class="message-item"><strong>System</strong>: Welcome to the archive.</div>
            </div>
            
            <div class="bottom-bar">
                YEONWOO. ARCHIVE.HAML / 2025
            </div>
        </div>
    </div>

    <script>
        function addMsg() {
            const name = document.getElementById('userName').value;
            const msg = document.getElementById('userMessage').value;
            const list = document.getElementById('msgList');

            if(!name || !msg) return alert("Please fill in both fields.");

            const item = document.createElement('div');
            item.className = 'message-item';
            item.innerHTML = `<strong>${name}</strong>: ${msg}`;
            list.prepend(item);

            document.getElementById('userName').value = '';
            document.getElementById('userMessage').value = '';
        }
    </script>
</body>
</html>
